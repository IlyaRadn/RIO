function myIdeasBox(withRank){
  const mine=(me.mine||[]).map(ideaById).filter(Boolean); if(!mine.length) return "";
  const r = withRank ? ranked() : [];
  return `<div class="box small"><b>Твои идеи</b> <span class="muted">видишь только ты</span><div class="mine" style="margin-top:8px">${mine.map(i=>{
    const place = withRank ? r.findIndex(x=>x.id===i.id)+1 : 0;
    return `<div><span>${catE(i.cat)} ${esc(i.text)}</span>${withRank?`<span class="coins">${place} место · ${(r[place-1]||{}).coins||0}</span>`:""}</div>`;}).join("")}</div></div>`;
}
function catLeft(i){ const s=sets(); return (s.cats[i]||0) - ((me.catsUsed||[0,0,0])[i]||0); }
function curCat(){ if(draft.cat!=null && catLeft(draft.cat)>0) return draft.cat; for(let i=0;i<3;i++) if(catLeft(i)>0) return i; return 0; }
function playerIdeas(){
  const s=sets(), done=me.done||0;
  if(done>=s.cards) return `<div class="eyebrow">Раунд идей</div><div class="h">Все карты сданы</div>${myIdeasBox(false)}<div class="wait"><div class="bigcat">😸</div><b>Ждём остальных</b><div class="small muted">Когда все допишут, ведущий закроет раунд.</div></div>`;
  const type=(me.deck||[])[me.pos||0] || TYPE_KEYS[(me.pos||0)%TYPE_KEYS.length], T=TYPES[type];
  const head=`<div class="row between"><div class="eyebrow">Карта ${done+1} из ${s.cards}</div>${me.cardAt?`<div class="timer" style="font-size:22px" data-down="${me.cardAt+s.min*60000}">${mmss(me.cardAt+s.min*60000-Date.now())}</div>`:""}</div>`;
  if(!me.cardAt) return head+`<button class="facedown" data-act="draw" ${busy?"disabled":""} style="cursor:pointer;font:inherit"><span style="font-size:44px">🃏</span><b>Тяни карту</b><span class="small">Выпадет тип идеи и подсказка. На ответ ${s.min} мин.</span><span class="small" style="color:var(--gold-2)">Иногда выпадает ⭐ золотая карта: монеты за идею ×2</span></button>`;
  const cat=curCat(); const qp=pickQ(G.gid+":"+(me.pos||0)+":"+me.cardAt, type, false);
  return head+`
  <div class="icard${me.gold?" goldcard":""}${once("card:"+G.gid+":"+(me.pos||0)+":"+me.cardAt,"cardflip")}">
    <div class="band" style="background:${T.c}"><b>${me.gold?"⭐ ":""}${T.name}</b><span>${me.gold?"Золотая карта · монеты ×2":esc(proj().name)}</span></div>
    <div class="hint${qPick.flash?" qflash":""}">${qList(type)[qp.qi]||T.q}<small>${T.ex}</small></div>
    ${type==="proj"?"":`<div class="projq${qPick.flash?" qflash":""}"><b>Про проект:</b> ${(PQ[G.project||"up"]||[])[qp.pi]||""}</div>`}
    <div style="padding:0 14px"><button class="btn ghost sm" data-act="reroll" type="button">🎲 Другой вопрос</button> <span class="small muted">бесплатно, сколько угодно</span></div>
    <div class="field"><label for="idea" class="small muted">Твоя идея · что болит → что сделать → что получим</label><textarea id="idea" maxlength="400" placeholder="Проблема: … Идея: … Эффект: …">${esc(draft.text)}</textarea></div>
  </div>
  <div><div class="eyebrow" style="margin-bottom:6px">Насколько веришь в идею</div>
    <div class="cats">${CATS.map((c,i)=>{const left=catLeft(i);return `<button class="cat" data-cat="${i}" aria-pressed="${cat===i}" ${left<=0?"disabled":""}><span class="e">${catE(i)}</span><b>${c.name}</b><i class="mm">${c.meme}</i><small>осталось ${Math.max(0,left)}</small></button>`}).join("")}</div></div>
  <button class="btn gold block" data-act="submit" ${busy?"disabled":""}>Сдать карту</button>
  <button class="btn ghost block sm" data-act="skip" ${busy?"disabled":""}>Пропустить карту →</button>
  <div class="small muted">Не идёт вопрос — пропускай, это нормально. Когда время выйдет, написанное сдастся само, пустая карта пропустится.</div>`;
}
function playerAuction(){
  const s=sets(), id=lotId(), lot=ideaById(id), order=G.order||[], idx=G.idx||0;
  const wallet=s.coins-(me.spent||0), myBet=(me.bets||{})[id], isMine=(me.mine||[]).includes(id);
  const top=`<div class="wallet"><span class="small">Твой кошелёк</span><b>${wallet} 🪙</b></div>
    <div class="eyebrow">Аукцион · идея ${idx+1} из ${order.length}</div>
    ${lot?`<div class="icard"><div class="band" style="background:${TYPES[lot.type]?TYPES[lot.type].c:"var(--ink)"}"><b>${TYPES[lot.type]?TYPES[lot.type].name:""}</b><span style="font-size:20px">${x2(lot)} ${catE(lot.cat)}</span></div><div class="txt">${esc(lot.text)}</div></div>`:`<div class="hint2">Загружаем идею…</div>`}`;
  const vals=G.revealVals||[], sum=vals.reduce((a,b)=>a+b,0);
  const revealed = G.revealed ? `<div class="box" style="text-align:center"><div class="eyebrow">Ставки вскрыты</div><div class="votes" style="justify-content:center;margin:8px 0;min-height:0">${revCards(vals,"p")}</div>${revSum(sum,vals.length,"p")}${isGold(lot)?`<div class="small muted">Золотая карта: в итогах будет ${sum*2} 🪙</div>`:""}</div>` : "";
  if(isMine) return top+`<div class="betok"><b>Это твоя идея ${catE(1)}</b><div class="small" style="margin-top:4px">На свою идею ставить нельзя. Никто не знает, что она твоя.</div></div>`+revealed;
  if(myBet!=null){ const n=meowCount(myBet); return top+`<div class="betok"><div class="meowtxt">${n?Array(n).fill("Мяу!").join(" "):"Пас принят"}</div><div class="small" style="margin-top:4px">Ставка <b>${myBet} 🪙</b> принята.${G.revealed?"":" Ждём, когда ведущий вскроет карты."}</div></div>`+revealed; }
  if(G.revealed) return top+`<div class="hint2">Ставки по этой идее уже вскрыты, ты не успел поставить.</div>`+revealed;
  const max=Math.min(21, wallet); if(fib!=null && fib>max) fib=null;
  const n=fib==null?0:meowCount(fib);
  return top+`
  <div><div class="eyebrow" style="margin-bottom:6px">Сколько вложишь</div>
    <div class="fib">${FIB.map(v=>`<button class="fc" data-fib="${v}" aria-pressed="${fib===v}" ${v>max?"disabled":""}>${v}<small>${v===0?"пас":"монет"}</small></button>`).join("")}</div></div>
  <div class="small muted">${fib==null?"Выбери карту. Чем больше ставка, тем больше котов мяукнет.":(n?`На ${fib} 🪙 мяукнут ${n} ${n===1?"кот":"кота"}.`:"На пас коты молчат.")}</div>
  <div class="final">Ставка окончательная, изменить её нельзя</div>
  <button class="btn gold block" data-act="bet" ${busy||fib==null||!lot?"disabled":""}>${fib==null?"Выбери ставку":`Поставить ${fib} 🪙`}</button>`;
}
function playerResults(){
  const list=ranked(), win=list[0];
  return `<div class="eyebrow">Итоги · ${esc(proj().name)}</div>
  <div class="h">${win?"Победила идея: "+plural(win.coins,"монета","монеты","монет"):"Идей не было"}</div>
  ${podium(list, true)}
  ${myBadges(list)}
  ${myIdeasBox(true)}
  ${awards(list)}
  <div class="small muted" style="text-align:center">Места своих идей видишь только ты. Спасибо за игру!</div>`;
}

/* ================= награды ================= */
function awards(list){
  if(list.length<2) return "";
  const out=[], vb=(G&&G.valsBy)||{};
  let sp=null; list.forEach(i=>{ const v=vb[i.id]||[]; if(v.length>=2){ const d=Math.max(...v)-Math.min(...v); if(d>0 && (!sp||d>sp.d)) sp={i,d}; } });
  if(sp) out.push(["⚡","Самая спорная идея",sp.i,`Ставки разошлись на ${sp.d} монет`]);
  const dh=list.slice(0,3).find(i=>(i.cat||0)===0 && i.coins>0); if(dh) out.push(["🐴","Тёмная лошадка",dh,"Автор поставил кота-скептика, а команда поверила"]);
  const ov=list.filter(i=>(i.cat||0)===2).slice(-1)[0]; if(ov && list.indexOf(ov)>=3) out.push(["🫠","Переоценили",ov,"Кот ва-банк, а монет немного"]);
  const g=list.find(i=>isGold(i) && i.coins>0); if(g) out.push(["⭐","Золотая карта сыграла",g,`${g.base} монет удвоились до ${g.coins}`]);
  if(!out.length) return "";
  const fresh=once("awards:"+G.gid+":"+view,"x")!=="";
  return `<div><div class="eyebrow" style="margin-bottom:8px">Награды команды</div><div class="awards">${out.map(([ic,t,i,n],k)=>`<div class="award${fresh?" popin":""}" style="${fresh?`animation-delay:${(2.4+k*.25).toFixed(2)}s`:""}"><span class="ai">${ic}</span><b>${t}</b><p>${esc(i.text)}</p><small>${n}</small></div>`).join("")}</div></div>`;
}
function myBadges(list){
  const s=sets(), mine=me.mine||[], mb=me.bets||{}, top3=list.slice(0,3), win=list[0], spent=me.spent||0, out=[];
  if(win && mine.includes(win.id)) out.push(["👑","Король котофонда","Твоя идея на первом месте"]);
  if(top3.some(i=>mine.includes(i.id) && (i.cat||0)===2)) out.push(["🤑","Ва-банк окупился","Твой кот ва-банк в тройке"]);
  if(top3.some(i=>mine.includes(i.id) && (i.cat||0)===0)) out.push(["🐴","Скромняга","Кот-скептик сомневался зря"]);
  if(win && (mb[win.id]||0)>=8) out.push(["🎯","Снайпер",`Вложил ${mb[win.id]} в победителя`]);
  if(list.some(i=>mine.includes(i.id) && isGold(i))) out.push(["⭐","Золотые лапки","Тебе выпала золотая карта"]);
  if(mine.length>=s.cards) out.push(["💡","Генератор идей","Сдал все карты"]);
  if(spent>=s.coins*.9) out.push(["💸","Щедрый инвестор",`Вложил ${spent} из ${s.coins}`]);
  else if(Object.keys(mb).length && spent<=s.coins*.3) out.push(["🐷","Кот-копилка","Сберёг монеты, но они сгорели 😿"]);
  if(!out.length) out.push(["🐱","Участник котофонда","Спасибо, что играл"]);
  const fresh=once("badges:"+G.gid,"x")!=="";
  return `<div><div class="eyebrow" style="margin-bottom:8px">Твои ачивки · видишь только ты</div><div class="badges">${out.map(([ic,t,n],k)=>`<div class="badge${fresh?" popin":""}" style="${fresh?`animation-delay:${(2.2+k*.2).toFixed(2)}s`:""}"><span class="bi">${ic}</span><div><b>${t}</b><span>${n}</span></div></div>`).join("")}</div></div>`;
}

/* ================= таймеры ================= */
function tick(){
  const now=Date.now();
  if(document.querySelector("[data-sleep]") && now-lastSnore>4200) snore();
  document.querySelectorAll("[data-up]").forEach(el=>{ el.textContent=mmss(now-(+el.dataset.up)+999); });
  document.querySelectorAll("[data-down]").forEach(el=>{ const left=(+el.dataset.down)-now; el.textContent=mmss(left); el.classList.toggle("low", left<30000); el.classList.toggle("pulse", left>0 && left<=10000);
    const sec=Math.ceil(left/1000); if(sec>0 && sec<=10 && sec!==lastTickSec){ lastTickSec=sec; tickSnd(sec<=3); } });
  if(view==="player" && G && G.phase==="ideas" && joined() && me.cardAt){
    const s=sets(); const key=G.gid+":"+(me.pos||0)+":"+me.cardAt;
    if((me.done||0)<s.cards && now >= me.cardAt + s.min*60000 && autoFired!==key && !busy){ autoFired=key; buzzer(); submitIdea(true); }
  }
}
setInterval(tick, 1000);

/* ================= действия ================= */
async function hostUpdate(patch){ await gs().update(patch); }
function submitIdea(auto){
  return run(async ()=>{
    const s=sets(), text=draft.text.trim().slice(0,400), type=(me.deck||[])[me.pos||0] || TYPE_KEYS[(me.pos||0)%TYPE_KEYS.length];
    if(!text && !auto){ errMsg="Напиши идею: хотя бы одно предложение."; return; }
    if(text){
      const cat=curCat(); const ref=db.collection("ideas").doc();
      const qtext=qList(type)[qPick.qi]||""; await ref.set({gid:G.gid, type, text, cat, gold:!!me.gold, q:qtext, at:Date.now()});
      const cu=(me.catsUsed||[0,0,0]).slice(); cu[cat]=(cu[cat]||0)+1;
      await kf().update({done:(me.done||0)+1, pos:(me.pos||0)+1, cardAt:null, gold:false, catsUsed:cu, mine:[...(me.mine||[]), ref.id]});
    } else {
      await kf().update({done:(me.done||0)+1, pos:(me.pos||0)+1, cardAt:null, gold:false});
    }
    draft={text:"", cat:null};
  }, "Не получилось сдать карту. Попробуй ещё раз.");
}
function goldFx(){ setTimeout(()=>{ banner("⭐","Золотая карта!","Монеты за эту идею удвоятся"); if(soundOn){ const ac=audio(); if(ac){ chime(ac,ac.currentTime+.02); chime(ac,ac.currentTime+.25); meowOnce(ac,ac.currentTime+.3,1.35,1); } } rain(12,["⭐","✨","🪙"]); }, 250); }
const ACT = {
  reroll(){ if(!me || !G) return; const type=(me.deck||[])[me.pos||0] || TYPE_KEYS[(me.pos||0)%TYPE_KEYS.length]; pickQ(G.gid+":"+(me.pos||0)+":"+me.cardAt, type, true); qPick.flash=true; dice(); render(); setTimeout(()=>{ qPick.flash=false; }, 50); },
  sound(){ soundOn=!soundOn; if(soundOn) audio(); render(); },
  snore(){ audio(); setTimeout(()=>{ snore(); render(); }, 60); },
  create(){ run(()=>gs().set({gid:rid(), code:newCode(), project:"up", phase:"lobby", settings:DEF, order:[], idx:0, revealed:false, revealVals:[], results:{}, at:Date.now()})); },
  newcode(){ run(async ()=>{ const code = (SITE && window.KF_NET && window.KF_NET.renew) ? await window.KF_NET.renew() : "KOT-" + String(Math.floor(100+Math.random()*900)); await hostUpdate({code}); }); },
  startIdeas(){ run(()=>hostUpdate({phase:"ideas", startedAt:Date.now()})); },
  endIdeas(){ run(()=>hostUpdate({phase:"backlog"})); },
  backLobby(){ run(()=>hostUpdate({phase:"lobby"})); },
  backIdeas(){ run(()=>hostUpdate({phase:"ideas"})); },
  startAuction(){ run(()=>hostUpdate({phase:"auction", order:auctionOrder(), idx:0, revealed:false, revealVals:[], results:{}, valsBy:{}})); },
  reveal(){ run(()=>{ const id=lotId(); const vals=shuffle(bets.filter(b=>b.idea===id).map(b=>+b.v||0)); const sum=vals.reduce((a,b)=>a+b,0);
    return hostUpdate({revealed:true, revealVals:vals, results:Object.assign({}, G.results||{}, {[id]:sum}), valsBy:Object.assign({}, G.valsBy||{}, {[id]:vals}), skippedLots:(G.skippedLots||[]).filter(x=>x!==id)}); }); },
  nextLot(){ const k=nextIdx(); run(()=>hostUpdate(k<0 ? {phase:"results"} : goLot(k))); },
  jumpLot(el){ const k=+el.dataset.k; if(!G || !(k>=0) || k>=(G.order||[]).length || k===(G.idx||0)) return; lotsOpen=true; run(()=>hostUpdate(goLot(k))); },
  skipLot(){ const id=lotId(); if(!id || G.revealed || bets.some(b=>b.idea===id && (+b.v||0)>0)) return; swoosh(false);
    const k=nextIdx(id);
    const upd={results:Object.assign({}, G.results||{}, {[id]:0}), valsBy:Object.assign({}, G.valsBy||{}, {[id]:[]}), skippedLots:(G.skippedLots||[]).filter(x=>x!==id).concat([id])};
    if(k<0) upd.phase="results"; else Object.assign(upd, goLot(k));
    run(()=>hostUpdate(upd)); },
  toResults(){ run(()=>hostUpdate({phase:"results"})); },
  askNew(){ confirmNew=true; render(); window.scrollTo({top:0,behavior:"smooth"}); },
  cancelNew(){ confirmNew=false; render(); },
  newGame(){ confirmNew=false; run(()=>gs().set({gid:rid(), code:newCode(), project:G.project||"up", phase:"lobby", settings:sets(), order:[], idx:0, revealed:false, revealVals:[], results:{}, at:Date.now()})); },
  async csv(){
    const list=ranked(); const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
    const rows=[["Место","Идея","Тип","Вопрос на карте","Кот автора","Золотая карта","Монеты"].map(q).join(";")].concat(list.map((i,n)=>[n+1, i.text, TYPES[i.type]?TYPES[i.type].name:"", i.q||"", CATS[i.cat||0].name, isGold(i)?"да, ×2":"", i.coins].map(q).join(";")));
    try{ await downloads.save({filename:"kotofond-"+(G.project||"game")+".csv", data:"﻿"+rows.join("\r\n")}); }
    catch(e){ if(e && e.code!=="declined"){ errMsg="Не получилось скачать файл здесь. Открой страницу в браузере на компьютере."; render(); } }
  },
  join(){
    const code=(document.getElementById("jcode")||{}).value||join.code, nick=((document.getElementById("jnick")||{}).value||join.nick).trim().slice(0,24);
    join.code=code; join.nick=nick;
    if(normCode(code)!==normCode(G.code)){ errMsg="Код не подходит. Проверь, что ввёл код, который назвал ведущий."; render(); return; }
    if(!nick){ errMsg="Придумай ник: его увидит только ведущий."; render(); return; }
    const s=sets();
    run(async ()=>{
      await db.doc("players/"+uid).set({gid:G.gid, nick, avatar:join.avatar, at:Date.now()});
      if(!(me && me.gid===G.gid)) await kf().set({gid:G.gid, deck:(s.cards===9 ? shuffle(TYPE_KEYS) : deal(s.cards)), pos:0, swapsUsed:0, done:0, cardAt:null, catsUsed:[0,0,0], mine:[], bets:{}, spent:0});
    }, "Не получилось войти. Попробуй ещё раз.");
  },
  draw(){ const gold=Math.random()<.2; swoosh(false); if(gold) goldFx(); run(()=>kf().update({cardAt:Date.now(), gold})); },
  submit(){ if(draft.text.trim()) swoosh(true); submitIdea(false); },

  skip(){ draft={text:"", cat:null}; swoosh(false);
    run(async ()=>{ const upd={done:(me.done||0)+1, pos:(me.pos||0)+1, cardAt:null, gold:false, skipped:(me.skipped||0)+1};
      if((me.pos||0)+1>=(me.deck||[]).length) upd.deck=(me.deck||[]).concat(deal(9)); await kf().update(upd); }); },
  bet(btn){
    const id=lotId(); if(fib==null || !id) return; const v=fib; const n=meowCount(v);
    meow(n, true); confetti(btn, Math.max(2,n*3));
    run(async ()=>{ await db.collection("bets").doc().set({gid:G.gid, idea:id, v, at:Date.now()});
      await kf().update({bets:Object.assign({}, me.bets||{}, {[id]:v}), spent:(me.spent||0)+v}); fib=null; }, "Ставка не прошла. Попробуй ещё раз.");
  }
};

document.addEventListener("click", e=>{
  audio(); /* первый клик открывает звук в браузере */
  const v=e.target.closest("[data-view]"); if(v){ view=v.dataset.view; errMsg=""; render(); return; }
  const at=e.target.closest("[data-avtab]"); if(at){ join.tab=at.dataset.avtab; render(); return; }
  const av=e.target.closest("[data-av]"); if(av){ join.avatar=av.dataset.av; render(); return; }
  const c=e.target.closest("[data-cat]"); if(c && !c.disabled){ draft.cat=+c.dataset.cat; catSound(draft.cat); render(); return; }
  const f=e.target.closest("[data-fib]"); if(f && !f.disabled){ fib=+f.dataset.fib; render(); return; }
  const st=e.target.closest("[data-set]"); if(st && G && !busy){
    const [k,i]=st.dataset.set.split(":"), d=+st.dataset.d, s=sets();
    const lim={min:[1,10,1], cards:[1,18,1], swaps:[0,5,1], coins:[20,500,10], cats:[0,18,1]}[k];
    if(k==="cats"){ const cats=s.cats.slice(); cats[+i]=Math.max(lim[0],Math.min(lim[1],cats[+i]+d)); s.cats=cats; }
    else s[k]=Math.max(lim[0],Math.min(lim[1],s[k]+d*lim[2]));
    run(()=>hostUpdate({settings:s})); return; }
  const a=e.target.closest("[data-act]"); if(a && ACT[a.dataset.act] && !a.disabled){ ACT[a.dataset.act](a); }
});
document.addEventListener("input", e=>{
  if(e.target.id==="idea") draft.text=e.target.value;
  if(e.target.id==="jcode") join.code=e.target.value;
  if(e.target.id==="jnick") join.nick=e.target.value;
});
document.addEventListener("change", e=>{ if(e.target.name==="proj" && G) run(()=>hostUpdate({project:e.target.value})); });
document.addEventListener("keydown", e=>{ if(e.key==="Enter" && (e.target.id==="jcode"||e.target.id==="jnick")){ e.preventDefault(); ACT.join(); } });

render();
boot();
</script>
</body></html>
