<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Проекты: КИБ Премиум">
<title>Проекты: КИБ Премиум</title>
<style>
  :root{
    --bg:#f5f7fa; --surface:#ffffff; --surface-2:#eef1f7;
    --ink:#161b24; --ink-2:#556074; --ink-3:#8a94a6;
    --line:#e0e6ef; --line-2:#cdd6e3; --accent:#3b5bdb; --accent-soft:#e8ecfb;
    --good:#2f9e6e; --gold:#bf8f2a;
    --shadow:0 1px 2px rgba(20,27,40,.06),0 6px 20px rgba(20,27,40,.06);
    --shadow-lg:0 2px 4px rgba(20,27,40,.06),0 14px 40px rgba(20,27,40,.12);
    color-scheme:light dark;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0d1016;--surface:#151a22;--surface-2:#1c222c;--ink:#e9edf4;--ink-2:#a3adbe;--ink-3:#6b7688;
      --line:#28303c;--line-2:#333d4c;--accent:#7089f2;--accent-soft:#1e2740;--good:#3bb57e;--gold:#e3ba4d;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.35);--shadow-lg:0 2px 4px rgba(0,0,0,.4),0 18px 48px rgba(0,0,0,.5)}
  }
  :root[data-theme="light"]{--bg:#f5f7fa;--surface:#ffffff;--surface-2:#eef1f7;--ink:#161b24;--ink-2:#556074;--ink-3:#8a94a6;--line:#e0e6ef;--line-2:#cdd6e3;--accent:#3b5bdb;--accent-soft:#e8ecfb;--good:#2f9e6e;--gold:#bf8f2a;--shadow:0 1px 2px rgba(20,27,40,.06),0 6px 20px rgba(20,27,40,.06);--shadow-lg:0 2px 4px rgba(20,27,40,.06),0 14px 40px rgba(20,27,40,.12)}
  :root[data-theme="dark"]{--bg:#0d1016;--surface:#151a22;--surface-2:#1c222c;--ink:#e9edf4;--ink-2:#a3adbe;--ink-3:#6b7688;--line:#28303c;--line-2:#333d4c;--accent:#7089f2;--accent-soft:#1e2740;--good:#3bb57e;--gold:#e3ba4d;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.35);--shadow-lg:0 2px 4px rgba(0,0,0,.4),0 18px 48px rgba(0,0,0,.5)}

  *{box-sizing:border-box} body{margin:0}
  .wrap{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:56px clamp(16px,5vw,64px) 80px;-webkit-font-smoothing:antialiased;line-height:1.5}
  header{max-width:1080px;margin:0 auto 36px}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);display:flex;gap:10px;align-items:center;margin-bottom:14px}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
  h1{font-size:clamp(30px,4.5vw,46px);line-height:1.05;margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}

  .grid{max-width:1080px;margin:0 auto;display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .card{--c:var(--accent);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 26px 22px;box-shadow:var(--shadow);text-decoration:none;color:inherit;position:relative;overflow:hidden;min-height:190px;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
  .card.gold{--c:var(--gold)} .card.green{--c:var(--good)} .card.blue{--c:var(--accent)}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
  .card:focus-visible{outline:2px solid var(--c);outline-offset:3px}
  .card .accentbar{position:absolute;left:0;top:0;right:0;height:4px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 35%,var(--surface)))}
  .card h2{font-size:20px;line-height:1.22;margin:18px 0 8px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
  .card .meta{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-bottom:16px}
  .card .open{margin-top:auto;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--c)}
  .card .open .arrow{transition:transform .16s ease}
  .card:hover .open .arrow{transform:translateX(4px)}

  .card.ghost{border-style:dashed;box-shadow:none;background:transparent;align-items:center;justify-content:center;text-align:center;color:var(--ink-3);cursor:default}
  .card.ghost:hover{transform:none;box-shadow:none;border-color:var(--line-2)}
  .card.ghost .plus{font-size:26px;line-height:1;margin-bottom:10px;opacity:.6}
  .card.ghost .gt{font-size:13.5px;font-weight:600;color:var(--ink-2)}
  .card.ghost .gd{font-size:12.5px;margin-top:4px}

  @media (max-width:520px){.wrap{padding:38px 16px 56px}.grid{grid-template-columns:1fr;gap:16px}.card{padding:22px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow"><span class="dot"></span>Планирование работы</div>
    <h1>Проекты: КИБ Премиум</h1>
  </header>

  <main class="grid">
    <a class="card gold" href="./upremium/">
      <span class="accentbar" aria-hidden="true"></span>
      <h2>Приложение UPremium «Мобильный ассистент»</h2>
      <div class="meta">Мобильное приложение</div>
      <span class="open">Открыть <span class="arrow" aria-hidden="true">→</span></span>
    </a>

    <a class="card green" href="./sps/">
      <span class="accentbar" aria-hidden="true"></span>
      <h2>Рабочее место сотрудника СПС</h2>
      <div class="meta">Внутренняя система</div>
      <span class="open">Открыть <span class="arrow" aria-hidden="true">→</span></span>
    </a>

    <a class="card blue" href="./alternative-settlements/">
      <span class="accentbar" aria-hidden="true"></span>
      <h2>Рабочее место сотрудника: Альтернативные расчеты</h2>
      <div class="meta">CIBPREM · RFC-4113 · Международные переводы</div>
      <span class="open">Открыть <span class="arrow" aria-hidden="true">→</span></span>
    </a>
  </main>
</div>
</body>
</html>
